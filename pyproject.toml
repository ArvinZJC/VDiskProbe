[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vdiskprobe"
version = "1.0.0.dev0"
description = "A lightweight Python library and CLI for detecting virtual disk image formats and reading size metadata from local files, custom readers, and HTTP/HTTPS URLs."
authors = [{email = "SteveJobz@isarvin.com"}]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENCE"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: System :: Filesystems",
]

[project.urls]
Repository = "https://github.com/ArvinZJC/VDiskProbe"
Issues = "https://github.com/ArvinZJC/VDiskProbe/issues"
Changelog = "https://github.com/ArvinZJC/VDiskProbe/blob/main/CHANGELOG.md"

[project.scripts]
vdiskprobe = "vdiskprobe.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "black>=26.5.0", "build>=1.2", "setuptools>=77"]

[tool.setuptools.packages.find]
include = ["vdiskprobe*"]
exclude = ["tests*"]

[tool.setuptools.data-files]
"share/doc/vdiskprobe" = ["README.md", "CHANGELOG.md", "LICENCE"]

[tool.black]
line-length = 120
target-version = ["py311", "py312", "py313", "py314", "py315"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not packaging" --cov=vdiskprobe --cov-branch --cov-report=term-missing'
markers = ["packaging: build and install distribution artefacts in clean environments"]

[tool.coverage.run]
branch = true
source = ["vdiskprobe"]

[tool.coverage.report]
fail_under = 100
show_missing = true
precision = 2
